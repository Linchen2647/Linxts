[workspace]
resolver = "2"
members = [
    "crates/linxts-source",
    "crates/linxts-ir",
    "crates/linxts-compiler",
    "crates/linxts-runtime",
    "crates/linxts-ai",
    "crates/linxts-backend",
    "crates/linxts-cli",
    "crates/linxts-training",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/OWNER/linxts"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
